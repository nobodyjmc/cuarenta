  <style>
@charset "UTF-8";
:root{--paper:#efe5d0;--panel:#faf2e1;--ink:#343b31;--muted:#75664f;--line:#d2c1a0;--green:#234c3e;--green-dark:#173c31;--gold:#b49456;--rust:#86383d;--burgundy:#76333a;--wood:#493426;--serif:Georgia,'Times New Roman',serif;--sans:'Segoe UI',Arial,sans-serif;--grain:url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='paper'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.09' filter='url(%23paper)'/%3E%3C/svg%3E")}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% 12%,#fff8e5a8,transparent 72%),var(--grain),var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select,summary{font:inherit}
button{cursor:pointer;color:inherit}
button{border:0}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #b99342;outline-offset:4px}
button,a,input{-webkit-tap-highlight-color:transparent}
button,summary{touch-action:manipulation}
svg{display:block}
.icon{width:21px;height:21px;flex-shrink:0}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:500}
button{background:transparent}
a{color:inherit}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;left:16px;top:-80px;z-index:100;background:var(--green);color:white;padding:14px}
.skip-link:focus{top:12px}

.app-shell{display:flex;min-height:100vh}
.sidebar{width:216px;flex-shrink:0;background:linear-gradient(90deg,#deceb0a6,#e9ddc5c4),var(--grain);border-right:1px solid #c8b187;box-shadow:2px 0 0 #fff8e746;padding:32px 19px 26px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px;text-align:left}
.brand-mark{background:var(--burgundy);color:#f3e4bf;width:47px;height:55px;display:flex;align-items:center;justify-content:center;position:relative;border:1px solid #b19155;border-radius:4px;font:29px var(--serif);box-shadow:inset 0 0 0 3px #76333a,inset 0 0 0 4px #b1915570,0 3px 0 #56352a}
.brand-mark>span{position:absolute;bottom:3px;font:8px var(--sans)}
.brand-word{font:26px var(--serif);letter-spacing:-1px;color:#633239}
.brand-word>span{display:block;font:7px var(--sans);letter-spacing:1.55px;margin-top:5px}
.sidebar nav{display:grid;gap:8px;margin-top:65px}
.nav-item{display:flex;align-items:center;gap:12px;border-radius:3px;padding:13px 14px;color:#75664f;font-size:13px;text-align:left;min-height:48px}
.nav-item:hover{background:#dfd0ae}
.nav-item.active{background:#dfceaac7;color:#6b3037;font-weight:600;box-shadow:inset 3px 0 #823d43}
.sidebar-bottom{margin-top:auto;padding:24px 13px 0;font-size:11px;color:#75664f;line-height:1.9}
.sidebar-bottom small{display:block;letter-spacing:1.5px;font-size:8px;margin-top:25px;color:#82704f}
.ecuador-stripes{display:flex;width:26px;height:4px;margin-bottom:13px}
.ecuador-stripes i:first-child{background:#d4b356;flex:2}
.ecuador-stripes i:nth-child(2){background:#597c8f;flex:1}
.ecuador-stripes i:last-child{background:#b66c55;flex:1}
.main-shell{width:calc(100% - 216px);margin-left:216px;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:87px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;margin:0 39px;gap:12px}
.breadcrumb{font-size:12px;color:#796a54;display:flex;align-items:center;gap:13px}
.breadcrumb button{padding:8px 0;color:#796a54}
.breadcrumb strong{font-weight:500;color:#514937}
.topbar-actions{display:flex;align-items:center;gap:18px}
.local-badge{font-size:11px;display:flex;align-items:center;gap:8px;color:#55664e}
.local-badge i,.turn-dot{width:6px;height:6px;border-radius:50%;background:#7ea476;display:block}
.icon-button{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;flex-shrink:0}
.icon-button:hover{background:#e9dcc1}
.mobile-settings{display:none}
main{padding:38px 39px 28px;max-width:1540px;width:100%;margin:0 auto}
main:focus{outline:none}
.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:10px;color:#796a54;padding:20px 39px 25px;margin-top:auto}
.footer button{display:flex;align-items:center;gap:10px;font-size:11px;padding:8px 0;color:#6e6048}
.footer .icon{width:15px;height:15px}
.eyebrow{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:2px;color:#86693c}
.welcome-heading,.game-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:31px}
h1{font-family:var(--serif);font-size:clamp(30px,3.3vw,49px);line-height:1.15;letter-spacing:-1.6px;margin-top:9px}
.intro{font-size:13px;color:#756954;margin-top:14px;line-height:1.75}
.edition-stamp{font-family:var(--serif);font-size:9px;letter-spacing:2px;color:#7c6848;text-align:center;border-left:1px solid var(--line);padding:10px 17px 10px 28px;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.edition-stamp span{display:block;font:italic 18px var(--serif);letter-spacing:0;margin-top:5px;color:#9a7e4d}
.lobby-layout{display:grid;grid-template-columns:1.18fr 1fr;gap:24px;min-height:470px}
.hero-table{padding:13px;background:repeating-linear-gradient(7deg,#513a29 0,#513a29 3px,#583f2c 4px,#604731 6px);border:1px solid #795b38;border-radius:12px;box-shadow:0 9px 22px #4a322a26,inset 0 0 0 2px #b69b656e,inset 0 0 0 5px #2e241a68;overflow:hidden}
.hero-table-inner{height:100%;min-height:453px;border-radius:4px;background:radial-gradient(ellipse at 50% 36%,#355f4a,#1d493b 66%,#15372d);box-shadow:inset 0 0 65px #061e244d,0 0 0 1px #baa06a8c;position:relative;display:flex;align-items:center;flex-direction:column;overflow:hidden}
.hero-table-inner:after,.game-table:after{content:'';pointer-events:none;position:absolute;inset:9px;border:1px solid #c8ae6b66;border-radius:2px;box-shadow:inset 0 0 0 3px #193e3000,0 0 0 3px #c8ae6b0d}
.hero-table-inner:before,.game-table:before{content:'';pointer-events:none;position:absolute;inset:0;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.55' filter='url(%23n)'/%3E%3C/svg%3E")}
.hero-kicker{color:#ced5b5;font-size:8px;font-weight:500;letter-spacing:2.3px;display:flex;align-items:center;gap:14px;margin-top:35px;position:relative}
.hero-kicker>span{width:20px;height:1px;background:#bfcda052}
.hero-fan{position:relative;width:295px;height:235px;margin-top:29px}
.playing-card{padding:0;width:84px;aspect-ratio:100/144;border-radius:7px;background:#fff9eb;box-shadow:0 3px 5px #081c1930;position:relative;flex-shrink:0;transition:transform .19s ease,box-shadow .19s ease,opacity .19s ease;user-select:none}
.playing-card>svg{width:100%;height:100%;overflow:visible;border-radius:7px}
.hero-fan .playing-card{width:122px;position:absolute;top:19px;left:86px;box-shadow:0 10px 18px #06231870}
.hero-fan .playing-card:first-child{transform:rotate(-21deg);left:24px;top:27px}
.hero-fan .playing-card:nth-child(2){transform:rotate(-2deg);z-index:1}
.hero-fan .playing-card:nth-child(3){transform:rotate(18deg);left:147px;top:24px;z-index:2}
.hero-wordmark{font:41px var(--serif);color:#ead8a9;text-shadow:0 2px 0 #142f26;letter-spacing:-1.1px;position:relative;margin-top:1px;text-align:center}
.hero-wordmark span{display:block;font:7px var(--sans);letter-spacing:2.1px;margin-top:12px;color:#b6c19d}
.hero-bottom{width:100%;padding:28px 27px 21px;display:flex;justify-content:space-between;gap:8px;font:italic 11px var(--serif);color:#c5c7a5;margin-top:auto;position:relative}
.setup-panel{background:linear-gradient(#fff8e9bf,#f4e7cfcc),var(--grain);border:1px solid #c6b188;border-radius:5px;padding:27px;box-shadow:0 4px 16px #4e3b2410,inset 0 0 0 4px #faf2e1,inset 0 0 0 5px #ddcbaa;display:flex;flex-direction:column}
.panel-number{font-size:8px;letter-spacing:1.7px;color:#806a47;margin-bottom:10px}
.setup-panel h2{font:30px var(--serif);letter-spacing:-.6px;margin-bottom:21px}
.mode-options{display:grid;gap:10px;margin-bottom:22px}
.mode-option{display:flex;align-items:center;text-align:left;gap:12px;border:1px solid var(--line);padding:13px;border-radius:4px;background:#faf2e180;min-height:76px;transition:background .2s,border-color .2s}
.mode-option.chosen{background:#ede0c3;border-color:#aa8e57}
.mode-option:hover{border-color:#a58c60}
.mode-icon{width:36px;height:36px;display:grid;place-items:center;background:#eadcc0;border-radius:3px;color:#7c6542}
.chosen .mode-icon{background:#dfcda5;color:#6b3037}
.mode-option strong{font-size:12px;font-weight:600;display:block}
.mode-option small{display:block;font-size:10px;color:#77664f;margin-top:4px}
.radio-dot{margin-left:auto;flex-shrink:0;width:14px;height:14px;border-radius:50%;border:1px solid #c4af84}
.chosen .radio-dot{border:4px solid #81424a;background:white}
.name-fields{display:flex;gap:12px;margin-bottom:16px}
.name-fields>label{display:block;font-size:10px;color:#74634e;flex:1;min-width:0}
.name-fields input{width:100%;background:#fff9ed;border:1px solid #d0bb91;border-radius:3px;padding:10px 12px;margin-top:6px;color:var(--ink);font-size:12px;height:42px}
.name-fields input::placeholder{color:#86765c}
.combo-choice{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:3px 0 18px}
.combo-choice>span{display:flex;gap:7px;font-size:10px;color:#766047;align-items:center}
.combo-choice .icon{width:13px;height:13px}
.combo-choice>div{display:flex;background:#e8dbc0;border-radius:6px;padding:3px}
.combo-choice button{min-height:32px;padding:5px 9px;font-size:10px;border-radius:4px;color:#716049}
.combo-choice button.chosen{background:#faf2e1;box-shadow:0 1px 4px #2b3a1e13;color:#76333a}
.button{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:46px;padding:12px 20px;border-radius:4px;font-size:12px;font-weight:600;transition:background .2s,transform .2s;white-space:normal}
.button.primary{background:linear-gradient(#2d5543,#234735);color:#fff8e7;border:1px solid #15392c;box-shadow:inset 0 0 0 2px #254a39,inset 0 0 0 3px #bda26155,0 2px 0 #503c2520}
.button.primary:hover:not(:disabled){background:#35604a;transform:translateY(-1px)}
.button:disabled{opacity:.45}
.button .icon{width:18px;height:18px}
.start-button{width:100%;justify-content:space-between;font-weight:500}
.resume-button{margin-top:9px;background:#ede0c3;color:#6b5140;font-size:11px}
.setup-footnote{text-align:center;font-size:9px;color:#7c6c52;margin-top:14px}
.setup-footnote button{font-size:9px;text-decoration:underline;text-underline-offset:3px;color:#765c37;padding:0 3px}
.home-notes{display:grid;grid-template-columns:1fr 1fr 1.1fr;margin-top:31px;gap:20px}
.home-notes>div,.home-notes>button{display:flex;align-items:center;gap:12px;text-align:left;padding:9px 0;color:#806b48}
.home-notes>button{padding-left:18px;border-left:1px solid var(--line)}
.home-notes .icon{width:23px;height:23px}
.home-notes strong{display:block;font-size:11px;font-weight:500;color:#65563d}
.home-notes small{display:block;font-size:9px;color:#7c6c52;margin-top:4px}
.home-notes>button>.icon:last-child{width:15px;margin-left:auto}
.game-heading{margin-bottom:24px}
.game-heading h1{font-size:36px}
.small-button{font-size:10px;min-height:38px;padding:9px 12px}
.button.outline{border:1px solid #c9b58c;background:transparent}
.button.outline:hover:not(:disabled){background:#e8d9b9}
.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 246px;gap:22px}
.game-column{min-width:0}
.game-table{min-height:520px;height:calc(100vh - 298px);max-height:640px;border-radius:12px;padding:23px 25px 15px;background:radial-gradient(ellipse at 45% 43%,#365e47 0%,#254c39 42%,#15362d 100%);position:relative;overflow:hidden;border:9px solid #513b2b;box-shadow:inset 0 0 0 1px #bda266b0,0 0 0 1px #b59965,0 5px 20px #39241626,inset 0 0 55px #0b261a66;display:flex;flex-direction:column;color:#edf0da}
.game-table:after{border-radius:3px;inset:7px}
.table-meta{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;color:#d2d5bc;font-size:8px;letter-spacing:1.2px;gap:8px}
.table-meta i{font-style:normal;opacity:.5;margin:0 5px}
.deck-label{display:flex;gap:6px;align-items:center;letter-spacing:.3px;text-transform:none}
.deck-label .icon{width:14px;height:14px}
.opponent-zone{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:21px}
.player-badge{display:flex;align-items:center;gap:9px;text-align:left;min-width:0}
.avatar{width:34px;height:34px;display:grid;place-items:center;background:#d6dfc522;border:1px solid #d6dfc533;border-radius:50%;color:#b8caa0;flex-shrink:0}
.avatar .icon{width:18px;height:18px}
.avatar-self{background:#d6c289;color:#365e45;border-color:#dfce9f}
.player-badge strong{display:block;font-size:11px;letter-spacing:.1px;font-weight:500;max-width:155px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.player-badge small{display:block;font-size:8px;color:#d1d2b7;margin-top:2px}
.is-turn strong{color:#f0ddb1}
.turn-dot{margin-left:6px;background:#d4c38c;width:5px;height:5px;box-shadow:0 0 0 4px #d4c38c12}
.opponent-hand{display:flex;padding-left:7px;align-items:center;gap:0}
.opponent-hand .playing-card{width:35px;margin-left:-7px;box-shadow:0 2px 4px #081c1920;transform:rotate(0deg);border-radius:3px}
.opponent-hand .playing-card:nth-child(odd){transform:translateY(3px)}
.table-center{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:160px;margin:15px 0 19px}
.felt-watermark{position:absolute;font:125px var(--serif);color:#d7c69b0c;pointer-events:none;user-select:none}
.table-cards{display:flex;justify-content:center;align-content:center;align-items:center;flex-wrap:wrap;gap:10px 12px;width:100%;position:relative;z-index:1;max-height:240px;overflow-y:auto;padding:8px 5px;scrollbar-width:thin;scrollbar-color:#d2d5bc40 transparent}
.table-cards>.playing-card{width:62px}
.table-cards>.playing-card.highlight{transform:translateY(-5px);box-shadow:0 0 0 3px #dbbd78,0 6px 15px #071d1a55}
.table-cards>.last-card:after{content:'ÚLTIMA';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:#d8c28c;padding:1px 6px;border-radius:3px;font-size:6px;letter-spacing:.6px;line-height:1.8;color:#30513a;white-space:nowrap}
.empty-table{text-align:center;color:#d0d1b5}
.empty-table span{display:block;font:italic 19px var(--serif)}
.empty-table small{display:block;font-size:9px;margin-top:7px}
.own-zone{position:relative;z-index:1}
.own-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
.hand-tip{font-size:7px;letter-spacing:1.6px;color:#d0d3ba;opacity:1}
.own-hand{display:flex;align-items:center;justify-content:center;gap:9px;min-height:113px;padding-top:8px}
.own-hand .playing-card{width:74px;box-shadow:0 4px 7px #08291b55}
.own-hand button:hover{transform:translateY(-9px);box-shadow:0 9px 10px #08291b55}
.own-hand button.selected{transform:translateY(-14px);box-shadow:0 0 0 3px #e3c87e,0 11px 15px #08291b66}
.own-hand button:focus-visible{outline-color:#edd59b;outline-offset:5px}
.waiting-hand:not(:has(.card-back)){opacity:.89}
.action-panel{background:linear-gradient(#fff7e4aa,#f7ecd5cc),var(--grain);border:1px solid var(--line);border-radius:4px;margin-top:14px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:82px}
.action-copy{display:flex;align-items:center;gap:12px;min-width:0}
.action-copy strong{font-size:11px;font-weight:500;display:block;line-height:1.6}
.action-copy small{font-size:9px;color:#76644c;display:block;line-height:1.6;margin-top:3px}
.action-dot{width:7px;height:7px;border-radius:50%;background:#acb59d;flex-shrink:0}
.action-dot.ready{background:#6a9254;box-shadow:0 0 0 4px #6a925410}
.move-controls{display:flex;align-items:center;gap:7px;flex-shrink:0}
.play-button{min-width:132px}
.option-button{font-size:9px;padding:9px}
.save-status{display:flex;align-items:center;gap:6px;font-size:9px;color:#74634a;margin-top:11px;line-height:1.5}
.save-status .icon{width:12px;height:12px}
.save-status>span{margin-left:auto}
.game-aside{display:flex;flex-direction:column;gap:17px;min-width:0}
.score-panel,.history-panel{background:linear-gradient(#fff7e4aa,#f7ecd5cc),var(--grain);border:1px solid var(--line);border-radius:4px;padding:20px;box-shadow:inset 0 0 0 3px #f8eedb}
.panel-label{display:flex;justify-content:space-between;font-size:8px;letter-spacing:1.2px;color:#7c613e;gap:8px;margin-bottom:17px;align-items:center}
.panel-label>span{font-size:8px;letter-spacing:0;color:#89704a}
.score-row{position:relative;margin-bottom:22px}
.score-name{font-size:11px;color:#64533a;display:flex;align-items:center;gap:7px;width:67%;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.score-dot{width:6px;height:6px;background:#446854;border-radius:50%;flex-shrink:0}
.score-dot.opponent-dot{background:#87434a}
.score-row>strong{font:26px var(--serif);display:block;margin-top:5px;color:#434e3b}
.score-row>strong>span{font:9px var(--sans);color:#7a684c}
.score-track{height:4px;background:#e8dcc4;border-radius:5px;overflow:hidden;margin-top:9px}
.score-track>span{height:100%;display:block;background:#476c55;border-radius:5px;transition:width .4s}
.score-track>span.opponent-fill{background:#9b5c61}
.score-row>small{display:block;font-size:8px;color:#7a684c;margin-top:7px}

/* Apple-inspired web language. Local CSS only, with the game content preserved. */
:root{
  color-scheme:dark;
  --paper:#000;
  --panel:#1c1c1e;
  --pearl:#1d1d1f;
  --ink:#f5f5f7;
  --muted:#b8b8bd;
  --muted-soft:#8e8e93;
  --line:#38383a;
  --line-soft:#2c2c2e;
  --accent:#0066cc;
  --accent-focus:#0071e3;
  --accent-dark:#2997ff;
  --tile:#1d1d1f;
  --tile-2:#252527;
  --tile-3:#2a2a2c;
  --shadow-card:0 3px 5px rgb(29 29 31 / .22);
  --radius-surface:18px;
  --radius-field:8px;
  --radius-control:9999px;
  --serif:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --grain:none;
  --green:#272729;
  --green-dark:#1d1d1f;
  --gold:#0066cc;
  --rust:#0066cc;
  --burgundy:#1d1d1f;
  --wood:#272729;
}
html{scroll-behavior:auto;background:var(--paper)}
body{min-height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.47}
button,input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent-focus);outline-offset:3px}
.app-shell{display:block;min-height:100dvh;background:var(--paper)}
.sidebar{position:sticky;inset:0 0 auto;width:100%;height:44px;z-index:20;flex-direction:row;align-items:center;gap:26px;padding:0 max(20px,calc((100vw - 1400px)/2));background:#000;border:0;box-shadow:none}
.brand{gap:9px;padding:0 8px;color:#fff}
.brand-mark{width:auto;height:30px;padding:0 7px;background:transparent;color:#fff;border:0;border-radius:5px;box-shadow:none;font:16px/1 var(--sans);letter-spacing:-.4px}
.brand-mark>span{position:static;margin-left:4px;font:9px/1 var(--sans)}
.brand-word{font:16px/1.1 var(--sans);font-weight:600;letter-spacing:-.3px;color:#fff}
.brand-word>span{font:9px/1.15 var(--sans);letter-spacing:.1px;color:#c7c7cc;margin-top:2px}
.sidebar nav{display:flex;align-items:center;gap:8px;margin:0 0 0 auto}
.nav-item{min-height:32px;padding:6px 12px;border-radius:var(--radius-control);background:transparent;color:#d2d2d7;font-size:12px;white-space:nowrap}
.nav-item .icon{width:15px;height:15px}
.nav-item:hover{background:#272729}
.nav-item.active{background:#272729;box-shadow:none;color:#fff;font-weight:500}
.sidebar-bottom{display:flex;align-items:center;gap:7px;margin:0 0 0 16px;padding:0;color:#c7c7cc;font-size:10px;line-height:1.25;white-space:nowrap}
.ecuador-stripes{width:16px;height:3px;margin:0;flex-shrink:0}
.sidebar-bottom small{display:none}
.main-shell{width:100%;min-height:calc(100dvh - 44px);margin:0;padding:0;display:flex;flex-direction:column}
.topbar{height:52px;margin:0;padding:0 max(24px,calc((100vw - 1400px)/2));border-bottom:1px solid var(--line);background:var(--pearl)}
.breadcrumb{font-size:13px;color:var(--muted);gap:12px}
.breadcrumb button{color:var(--ink);font-size:13px}
.breadcrumb strong{color:var(--ink);font-weight:500}
.topbar-actions{gap:12px}
.local-badge{font-size:12px;color:var(--muted)}
.local-badge i{display:none}
.icon-button{width:40px;height:40px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--panel);color:var(--ink);transition:background .18s ease,transform .18s ease}
.icon-button:hover{background:var(--pearl)}
main{width:100%;max-width:1400px;padding:24px 48px 32px}
.footer{width:100%;max-width:1400px;margin:0 auto;padding:20px 48px 24px;color:var(--muted);font-size:12px}
.footer button{color:var(--accent);font-size:13px}
.eyebrow{font:600 12px/1.3 var(--sans);letter-spacing:.02em;color:var(--muted)}
h1{font:600 clamp(38px,4.1vw,56px)/1.07 var(--sans);letter-spacing:-.28px;color:var(--ink);margin:8px 0 0}
h2,h3{color:var(--ink);font-family:var(--sans)}
.intro{max-width:54ch;margin-top:12px;color:var(--muted);font:400 17px/1.47 var(--sans);letter-spacing:-.2px}
.welcome-heading,.game-heading{align-items:flex-start;gap:20px;margin-bottom:28px}
.welcome-heading{margin-bottom:20px}
.edition-stamp{display:none}
.lobby-layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(350px,.88fr);grid-template-areas:"visual setup";align-items:stretch;gap:24px;min-height:0}
.hero-table{grid-area:visual;height:auto;min-width:0;display:flex;flex-direction:column;gap:12px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;overflow:visible}
.hero-table-inner{display:grid;place-items:center;min-height:clamp(390px,38vw,530px);height:100%;border:0;border-radius:var(--radius-surface);background:var(--tile);box-shadow:none;overflow:hidden}
.hero-table-inner:before,.hero-table-inner:after,.game-table:before,.game-table:after{display:none}
.hero-fan{width:min(100%,390px);height:285px;margin:0;transform:none}
.hero-fan .playing-card{top:16px;left:120px;width:156px;border-radius:8px}
.hero-fan .playing-card:first-child{left:24px;top:31px;transform:rotate(-14deg)}
.hero-fan .playing-card:nth-child(2){top:9px;left:117px;z-index:1;transform:rotate(0)}
.hero-fan .playing-card:nth-child(3){left:212px;top:29px;z-index:2;transform:rotate(14deg)}
.hero-bottom{position:static;width:100%;padding:0 4px;display:flex;justify-content:space-between;gap:12px;margin:0;color:var(--muted);font:400 14px/1.4 var(--sans)}
.setup-panel{grid-area:setup;justify-content:center;min-width:0;padding:28px;background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius-surface);box-shadow:none}
.setup-panel h2{margin:0 0 18px;font:600 34px/1.1 var(--sans);letter-spacing:-.4px}
.panel-number{display:none}
.mode-options{gap:10px;margin:0 0 16px}
.mode-option{min-height:64px;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--radius-surface);background:var(--panel);transition:border-color .18s ease,background .18s ease,transform .18s ease}
.mode-option:hover{border-color:#b8b8bc}
.mode-option.chosen{border:2px solid var(--accent);background:var(--panel)}
.mode-icon{width:38px;height:38px;border-radius:var(--radius-field);background:var(--pearl);color:var(--ink)}
.chosen .mode-icon{background:#e8f2fc;color:var(--accent)}
.mode-option strong{font-size:15px;font-weight:600;color:var(--ink)}
.mode-option small{font-size:13px;color:var(--muted);line-height:1.35}
.radio-dot{width:16px;height:16px;border-color:var(--muted-soft)}
.chosen .radio-dot{border:5px solid var(--accent);background:var(--paper)}
.difficulty-picker{gap:7px;margin-bottom:15px}
.difficulty-picker label,.name-fields>label{font-size:14px;font-weight:500;color:var(--ink)}
.difficulty-picker select,.name-fields input{height:46px;min-height:46px;padding:10px 14px;border:1px solid #8e8e93;border-radius:var(--radius-field);background:var(--paper);color:var(--ink);font-size:16px}
.difficulty-picker select{height:auto;min-height:46px}
.difficulty-note,.setup-footnote{font-size:13px;line-height:1.45;color:var(--muted);margin:0}
.name-fields{align-items:flex-end;gap:12px;margin-bottom:15px}
.name-fields input{margin-top:6px}
.name-fields input::placeholder{color:#636366;opacity:1}
.combo-choice{margin:2px 0 15px;gap:12px}
.combo-choice>span{font-size:14px;color:var(--ink)}
.combo-choice>div{background:var(--pearl);border-radius:var(--radius-control);padding:3px}
.combo-choice button{min-height:38px;padding:8px 15px;border-radius:var(--radius-control);font-size:14px;color:var(--muted)}
.combo-choice button.chosen{background:var(--paper);color:var(--accent);box-shadow:0 0 0 1px var(--line)}
.button{min-height:44px;padding:11px 20px;border:1px solid transparent;border-radius:var(--radius-control);font-size:15px;font-weight:500;line-height:1.25;white-space:nowrap;transition:background .18s ease,color .18s ease,transform .18s ease,border-color .18s ease}
.button.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
.button.primary:hover:not(:disabled){background:#005bb8;transform:translateY(-1px)}
.button:active:not(:disabled){transform:scale(.98)}
.button:disabled{opacity:.5}
.button.outline{border-color:var(--line);background:var(--panel);color:var(--accent)}
.button.outline:hover:not(:disabled){background:var(--pearl)}
.button.gold{background:var(--accent);color:#fff}
.button.gold:hover{background:#005bb8}
.start-button{width:100%;min-height:48px;padding:13px 20px;font-size:16px}
.resume-button{margin-top:9px;border-radius:var(--radius-control);background:var(--pearl);color:var(--ink);font-size:14px}
.setup-footnote{margin-top:14px;text-align:center}
.setup-footnote button{color:var(--accent);font-size:13px}
.rule-callout,.legacy-note,.ronda-notice{border:1px solid #b9d8f7;border-left:3px solid var(--accent);border-radius:var(--radius-field);background:#f1f7fd;color:#1d1d1f;font-size:14px;line-height:1.5;padding:12px 14px}
.rule-callout{margin:12px 0}
.rule-callout strong,.ronda-notice strong{color:var(--accent)}
.legacy-note{margin:12px 0}
.ronda-notice{gap:9px;margin:6px 0 12px;padding:10px 12px}
.difficulty-badge{padding:5px 11px;border:1px solid #b9d8f7;border-radius:var(--radius-control);background:#f1f7fd;color:var(--accent);font-size:12px;letter-spacing:0}
.home-notes{grid-template-columns:1fr 1fr 1.1fr;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);gap:22px}
.home-notes>div,.home-notes>button{gap:12px;padding:6px 0;color:var(--muted)}
.home-notes>button{border-left:1px solid var(--line);border-radius:0;padding-left:18px}
.home-notes .icon{width:20px;height:20px;color:var(--muted)}
.home-notes strong{font-size:14px;font-weight:600;color:var(--ink)}
.home-notes small{font-size:13px;line-height:1.4;color:var(--muted)}
.home-notes>button>.icon:last-child{color:var(--accent)}
.game-heading{align-items:center;margin-bottom:22px}
.game-heading h1{font-size:40px;line-height:1.1}
.game-heading .eyebrow{font-size:13px;letter-spacing:0;color:var(--muted)}
.small-button{min-height:42px;font-size:14px}
.game-layout{grid-template-columns:minmax(0,1fr) 270px;gap:22px}
.game-table{height:clamp(500px,calc(100dvh - 260px),680px);min-height:500px;max-height:680px;padding:22px 25px 18px;border:0;border-radius:var(--radius-surface);background:var(--tile);box-shadow:none;color:#f5f5f7}
.table-meta{font-size:12px;letter-spacing:0;color:#d2d2d7;text-transform:none}
.table-meta i{color:#7a7a7f}
.deck-label{font-size:13px;color:#d2d2d7}
.opponent-zone{margin-top:22px}
.player-badge strong{font-size:14px;font-weight:600;color:#f5f5f7}
.player-badge small{font-size:12px;color:#c7c7cc}
.avatar{width:36px;height:36px;background:#ffffff12;border:1px solid #ffffff2b;color:#e5e5ea}
.avatar-self{background:#ffffff18;border-color:#ffffff33;color:#fff}
.is-turn strong{color:#fff}
.turn-dot{background:var(--accent-dark);box-shadow:none}
.opponent-hand .playing-card{width:37px;border-radius:5px}
.table-center{margin:16px 0 20px}
.felt-watermark{color:#fff1;font-family:var(--sans)}
.table-cards{gap:10px 12px;scrollbar-color:#ffffff44 transparent}
.table-cards>.playing-card{width:68px}
.table-cards>.playing-card.highlight{outline:3px solid var(--accent-dark);outline-offset:2px;transform:translateY(-4px);box-shadow:var(--shadow-card)}
.table-cards>.last-card:after{background:var(--accent);color:#fff;border-radius:var(--radius-control);font-size:9px;padding:2px 8px}
.empty-table{color:#d2d2d7}
.empty-table span{font:500 24px/1.2 var(--sans);color:#f5f5f7}
.empty-table small{font-size:14px;color:#c7c7cc}
.own-label{margin-bottom:15px}
.hand-tip{font-size:11px;letter-spacing:.05em;color:#d2d2d7}
.own-hand{gap:10px;min-height:126px}
.playing-card,.own-hand .playing-card,.opponent-hand .playing-card,.hero-fan .playing-card{border-radius:8px;box-shadow:var(--shadow-card)}
.own-hand .playing-card{width:76px}
.own-hand button:hover{transform:translateY(-7px);box-shadow:var(--shadow-card)}
.own-hand button.selected{transform:translateY(-9px);outline:3px solid var(--accent-dark);outline-offset:2px;box-shadow:var(--shadow-card)}
.own-hand button:focus-visible{outline-color:var(--accent-focus);outline-offset:4px}
.action-panel{min-height:76px;padding:15px 16px;border:1px solid var(--line);border-radius:var(--radius-surface);background:var(--paper);}
.action-copy strong{font-size:15px;font-weight:600;line-height:1.35;color:var(--ink)}
.action-copy small{font-size:13px;color:var(--muted);line-height:1.4}
.action-dot{width:8px;height:8px;background:#8e8e93}
.action-dot.ready{background:var(--accent);box-shadow:none}
.move-controls{gap:8px}
.play-button{min-width:144px}
.option-button{font-size:13px;padding:10px 14px}
.save-status{font-size:12px;color:var(--muted);gap:7px}
.save-status .icon{color:var(--accent)}
.game-aside{gap:14px}
.score-panel,.history-panel{padding:20px;background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius-surface);box-shadow:none}
.panel-label{font-size:12px;letter-spacing:0;color:var(--muted);margin-bottom:18px}
.panel-label>span{font-size:12px;color:var(--muted)}
.score-name{font-size:14px;color:var(--ink);gap:8px}
.score-dot,.score-dot.opponent-dot{width:7px;height:7px;background:var(--muted-soft)}
.score-row>strong{font:600 30px/1.1 var(--sans);color:var(--ink)}
.score-row>strong>span{font:400 13px/1.2 var(--sans);color:var(--muted)}
.score-track{display:none}
.score-row>small{font-size:12px;color:var(--muted)}
.score-rule{font-size:12px;color:var(--muted);border-color:var(--line)}
.history-list{font-size:13px;color:var(--muted);gap:14px}
.history-list li.latest{color:var(--ink)}
.history-icon{color:var(--muted-soft)}
.help-tile{min-height:52px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--radius-surface);color:var(--ink);font-size:13px}
.help-tile small{font-size:12px;color:var(--muted)}
.help-tile>.icon:last-child{color:var(--accent)}
.privacy-curtain{background:#1d1d1ff5;color:#fff;padding:28px}
.privacy-icon{width:54px;height:54px;margin-bottom:15px;border:1px solid #ffffff3d;background:#ffffff14;color:#fff}
.privacy-curtain .eyebrow{font-size:12px;color:#d2d2d7}
.privacy-curtain h2{margin-top:10px;font:600 34px/1.1 var(--sans);color:#fff}
.privacy-curtain p:not(.eyebrow){margin:14px 0 22px;font-size:14px;line-height:1.5;color:#d2d2d7}
dialog{width:min(600px,calc(100% - 32px));max-height:calc(100dvh - 40px);padding:28px;border:1px solid var(--line);border-radius:var(--radius-surface);outline:0;background:var(--paper);color:var(--ink);box-shadow:none}
dialog::backdrop{background:rgb(0 0 0 / .42);backdrop-filter:none}
.modal-top{margin-bottom:15px}
.modal-top .eyebrow{font-size:12px;letter-spacing:.02em;color:var(--muted)}
.modal-top .icon-button{width:40px;height:40px}
dialog h2{font:600 34px/1.15 var(--sans);letter-spacing:-.4px}
.modal-intro,.rules-list p{font:400 16px/1.5 var(--sans);color:var(--muted)}
.modal-intro{margin:15px 0 20px}
.rules-list details{border-color:var(--line)}
.rules-list summary{font-size:15px;line-height:1.5}
.full-width{width:100%}
.text-button{font-size:14px;color:var(--accent)}
.rule-scores,.round-results,.final-score{background:var(--pearl);border:1px solid var(--line);border-radius:var(--radius-surface)}
.rule-scores strong,.round-results strong,.final-score strong{font-family:var(--sans);color:var(--ink)}
.rule-scores span,.round-results>div>span,.round-results p,.round-total,.final-score>div>span{color:var(--muted)}
.round-results>div+div{border-color:var(--line);background:var(--panel)}
.round-results p b{color:var(--accent)}
.winner-symbol{background:#e8f2fc;color:var(--accent)}
.winner-name{font:600 30px/1.15 var(--sans)}
.winner-subtitle{color:var(--muted);font-size:14px}
.score-divider{color:var(--muted-soft)}
.lesson-board{min-height:245px;padding:22px;border:0;border-radius:var(--radius-surface);background:var(--tile);box-shadow:none}
.lesson-label{font-size:12px;letter-spacing:.03em;color:#d2d2d7}
.lesson-table .playing-card,.lesson-hand .playing-card{width:62px}
.lesson-hand .playing-card.selected{outline:2px solid var(--accent-dark);outline-offset:2px;box-shadow:var(--shadow-card)}
.lesson-explanation{font-size:15px;line-height:1.5;color:var(--muted)}
.lesson-navigation .button{font-size:14px}
.toast{bottom:22px;padding:12px 18px;border:0;border-radius:var(--radius-control);background:#1d1d1f;color:#fff;font-size:14px;box-shadow:none}

@media(min-width:1500px){main{padding-top:40px}.hero-table-inner{min-height:530px}}
@media(max-width:1199px) and (min-width:621px){
  .sidebar{gap:14px;padding-right:20px;padding-left:20px}
  .sidebar nav{gap:2px}
  .nav-item{padding:6px 9px;font-size:11px}
  .sidebar-bottom{display:none}
  .main-shell{width:100%;margin:0}
  main{padding:28px 30px}
  .topbar{padding:0 30px}
  .footer{padding-right:30px;padding-left:30px}
  .lobby-layout{grid-template-columns:minmax(0,1fr) minmax(320px,.92fr);gap:18px}
  .setup-panel{padding:24px}
  .game-layout{grid-template-columns:minmax(0,1fr) 240px;gap:16px}
  .own-hand .playing-card{width:clamp(56px,6.6vw,72px)}
}

  .sidebar{gap:6px;padding-right:12px;padding-left:12px}
  .brand{gap:4px;padding:0}
  .brand-mark{padding:0 3px}
  .brand-word{font-size:14px}
  .brand-word>span{font-size:7px;letter-spacing:0}
  .nav-item{gap:5px;padding:5px 7px;font-size:10px}
  .nav-item .icon{width:13px;height:13px}
  .topbar{height:48px}
  .lobby-layout{grid-template-columns:1fr;grid-template-areas:"setup" "visual"}

  .help-tile{grid-column:1/-1}
}

  .sidebar{position:fixed;inset:auto 0 0;width:100%;height:calc(66px + env(safe-area-inset-bottom,0px));padding:0 12px env(safe-area-inset-bottom,0px);background:var(--paper);border:0;border-top:1px solid var(--line);backdrop-filter:none;box-shadow:none}

  .nav-item.active{color:var(--accent)}
  .nav-item .icon{width:19px;height:19px}
  .main-shell{width:100%;margin:0;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  .topbar{height:46px;margin:0;padding:0 16px}
  .breadcrumb{font-size:12px;gap:7px}
  .breadcrumb button,.breadcrumb strong{font-size:12px}
  .topbar-actions{gap:8px}
  .local-badge{font-size:11px}
  .icon-button{width:36px;height:36px}
  .sound-toggle{width:36px;height:36px}
  main{padding:16px 18px 20px}
  .eyebrow{font-size:12px;letter-spacing:0}
  h1{font-size:clamp(34px,9vw,38px);line-height:1.04;letter-spacing:-.3px;margin-top:6px}
  .intro{margin-top:6px;font-size:15px;line-height:1.35}
  .welcome-heading{margin-bottom:14px}
  .lobby-layout{grid-template-columns:1fr;grid-template-areas:"setup" "visual";gap:18px}
  .setup-panel{padding:16px;border-radius:var(--radius-surface)}
  .setup-panel h2{margin-bottom:12px;font-size:25px}
  .mode-options{gap:7px;margin-bottom:10px}
  .mode-option{min-height:52px;gap:9px;padding:8px 10px}
  .mode-icon{width:30px;height:30px}
  .mode-option strong{font-size:13px}
  .mode-option small{font-size:11px}
  .difficulty-picker{gap:5px;margin-bottom:10px}
  .difficulty-picker select,.name-fields input{min-height:42px;height:42px;font-size:16px}
  .difficulty-note{font-size:12px;line-height:1.3}
  .name-fields{gap:8px;margin-bottom:10px}
  .name-fields>label{font-size:13px}
  .combo-choice{flex-direction:row;align-items:center;gap:8px;margin:0 0 8px}
  .combo-choice>span{font-size:13px}
  .combo-choice button{min-height:38px;padding:6px 11px;font-size:13px}
  .rule-callout{margin:8px 0;padding:8px 10px;font-size:12px;line-height:1.35}
  .start-button{min-height:44px;font-size:15px}

/* Table views share the same cards and controls. */

/* Card impacts sit above the felt and never receive input. */
.play-impact {
  --impact-color: #b6ffdc;
  --impact-center: 43%;
  --impact-travel: clamp(56px, 18vmin, 126px);
  position: absolute;
  inset: 0;
  z-index: 6;
  overflow: hidden;
  pointer-events: none;
}

.play-impact--ronda,
.play-impact--win {
  --impact-color: #ffe097;
  --impact-travel: clamp(68px, 24vmin, 155px);
}

.play-impact::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% var(--impact-center), var(--impact-color), transparent 70%);
  animation: impact-glow 860ms 130ms ease-out both;
}

.impact-rays,
.impact-ring,
.impact-particles,
.impact-card,
.impact-hand {
  position: absolute;
  top: var(--impact-center);
  left: 50%;
  transform: translate(-50%, -50%);
}

.impact-rays {
  width: calc(var(--impact-travel) * 2.7);
  aspect-ratio: 1;
  background: repeating-conic-gradient(from 18deg, var(--impact-color) 0deg 3deg, transparent 3deg 36deg);
  mask-image: radial-gradient(transparent 15%, #000 30%, transparent 67%);
  animation: impact-rays 740ms 130ms ease-out both;
}

.impact-ring {
  width: calc(var(--impact-travel) * 2);
  aspect-ratio: 1;
  border: 2px solid var(--impact-color);
  border-radius: 50%;
  box-shadow: inset 0 0 12px var(--impact-color), 0 0 13px var(--impact-color);
  animation: impact-ring 690ms 130ms ease-out both;
}

.impact-ring::after {
  content: '';
  position: absolute;
  inset: -10px;
  border: 1px dashed var(--impact-color);
  border-radius: 50%;
  opacity: .7;
}

.impact-particles > i {
  position: absolute;
  inset: -3px auto auto -3px;
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: var(--impact-color);
  box-shadow: 0 0 9px var(--impact-color);
  animation: impact-particle 760ms 145ms cubic-bezier(.16, .68, .33, 1) both;
}

.impact-particles > i:nth-child(even) {
  --particle-distance: calc(var(--impact-travel) * 1.35);
  width: 4px;
  height: 4px;
  border-radius: 50%;
}

.impact-hand {
  width: clamp(65px, 12vw, 106px);
  color: var(--impact-color);
  filter: drop-shadow(0 3px 5px #09201a);
  animation: impact-hand 410ms cubic-bezier(.22, .72, .31, 1) both;
}

.impact-hand svg {
  width: 100%;
  height: auto;
}

.impact-card {
  animation: impact-land 950ms cubic-bezier(.18, .64, .25, 1) both;
}

.impact-card .playing-card {
  width: clamp(41px, 9vmin, 70px);
  box-shadow: 0 7px 16px #09201ab0;
}

.impact-caption {
  position: absolute;
  top: 74%;
  left: 50%;
  width: max-content;
  max-width: calc(100% - 24px);
  margin: 0;
  padding: 7px 16px;
  transform: translate(-50%, -50%);
  border: 1px solid var(--impact-color);
  border-radius: 999px;
  background: #101819;
  box-shadow: 0 7px 20px #050b0ac7;
  color: var(--impact-color);
  font-size: clamp(14px, 3.3vmin, 22px);
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  animation: impact-caption 900ms 140ms ease-out both;
}

.game-table:has(> .play-impact) {
  animation: impact-table 320ms 125ms ease-out both;
}

.is-compact-play .play-impact {
  --impact-center: 41%;
}

.is-compact-play .impact-caption {
  top: 72%;
  padding: 4px 12px;
}

@keyframes impact-land {
  0% { opacity: 0; transform: translate(-95%, -155%) rotate(-19deg) scale(1.25); }
  15% { opacity: 1; transform: translate(-50%, -50%) rotate(4deg) scale(.94); }
  29% { transform: translate(-50%, -56%) rotate(-2deg) scale(1.09); }
  46%, 82% { opacity: 1; transform: translate(-50%, -50%) rotate(0) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) rotate(0) scale(1); }
}

@keyframes impact-hand {
  0% { opacity: 0; transform: translate(-74%, -160%) rotate(-16deg); }
  40% { opacity: .86; transform: translate(-74%, -68%) rotate(5deg); }
  100% { opacity: 0; transform: translate(-105%, -110%) rotate(-10deg); }
}

@keyframes impact-rays {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
  19% { opacity: .76; }
  100% { opacity: 0; transform: translate(-50%, -50%) rotate(14deg) scale(1.18); }
}

@keyframes impact-glow {
  0%, 100% { opacity: 0; }
  16% { opacity: .31; }
  57% { opacity: .1; }
}

@keyframes impact-ring {
  0% { opacity: .95; transform: translate(-50%, -50%) scale(.15); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.24); }
}

@keyframes impact-particle {
  0% { opacity: 0; transform: rotate(calc(var(--i) * 36deg)) translateY(-6px); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: rotate(calc(var(--i) * 36deg)) translateY(calc(-1 * var(--particle-distance, var(--impact-travel)))) rotate(90deg) scale(.4); }
}

@keyframes impact-caption {
  0% { opacity: 0; transform: translate(-50%, -32%) scale(.93); }
  24%, 78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -54%) scale(1); }
}

@keyframes impact-table {
  0%, 100% { transform: translateX(0); }
  22% { transform: translateX(4px); }
  44% { transform: translateX(-3px); }
  69% { transform: translateX(2px); }
}

.reduce-motion .play-impact::before,
.reduce-motion .play-impact > :not(.impact-caption) {
  display: none;
}

@media (prefers-reduced-motion: reduce) {
  .play-impact::before,
  .play-impact > :not(.impact-caption) {
    display: none;
  }

  .play-impact .impact-caption,
  .game-table:has(> .play-impact) {
    animation: none;
  }
}

/* Interactive lessons share the cards and felt of the main table. */
.tutorial-game {

}

.tutorial-capture-options {

.tutorial-table,

.tutorial-table {

}

.tutorial-hand {

}

.tutorial-board .playing-card {

.tutorial-table .last-card::after {

.tutorial-hand button.playing-card {

.tutorial-board .playing-card:is(.highlight, .selected, [aria-pressed="true"]) {

.tutorial-capture-options .button,
.tutorial-actions .button {

}

.tutorial-feedback {

}

.tutorial-feedback[data-tone="correct"] {

}

.tutorial-feedback[data-tone="retry"] {

}

.tutorial-feedback strong {

}

.tutorial-feedback strong .icon {
  width: 16px;
  height: 16px;
}

.tutorial-actions {
  flex-wrap: wrap;
}

.tutorial-actions .button {
  flex: 1 1 auto;
}

.is-rotated-view .tutorial-game {
  --tutorial-zones: "table-label hand-label" "table-cards hand-cards";
  --tutorial-columns: minmax(0, 1.2fr) minmax(0, 1fr);
}

@media (orientation: landscape) and (max-height: 500px) {
  .tutorial-game {
    --tutorial-zones: "table-label hand-label" "table-cards hand-cards";
    --tutorial-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  }
}

@media (prefers-reduced-motion: no-preference) {
  .tutorial-board.is-solved .tutorial-table .last-card {
    animation: tutorial-capture 450ms ease-out;
  }

  .tutorial-feedback[data-tone="correct"] {
    animation: tutorial-feedback-glow 550ms ease-out;
  }
}

@keyframes tutorial-capture {
  0%, 100% { transform: translateY(0); }
  38% { transform: translateY(-5px) scale(1.05); }
}

@keyframes tutorial-feedback-glow {
  from { box-shadow: 0 0 0 4px #63ad8a50; }
  to { box-shadow: 0 0 0 0 #63ad8a00; }
}

@media (prefers-reduced-motion: no-preference) {

    animation: felt-deal 420ms cubic-bezier(.18, .69, .24, 1) calc(var(--deal-start) + var(--deal-delay, 0ms)) backwards;
  }

  .game-table.is-dealing .opponent-hand > .playing-card {
    --deal-start: 0ms;
    --deal-x: clamp(20px, 8vmin, 57px);
    --deal-y: clamp(14px, 6vmin, 34px);
  }

  .game-table.is-dealing .playing-card:nth-child(2) { --deal-delay: 52ms; }
  .game-table.is-dealing .playing-card:nth-child(3) { --deal-delay: 104ms; }
  .game-table.is-dealing .playing-card:nth-child(4) { --deal-delay: 156ms; }
  .game-table.is-dealing .playing-card:nth-child(5) { --deal-delay: 208ms; }

  .game-table.is-dealing .deck-label .icon {
    animation: felt-deck 580ms ease-out;
  }

  .hero-fan {
    animation: felt-welcome 520ms ease-out both;
  }

  .game-table.is-fresh-play .table-cards > .last-card {
    animation: felt-play 460ms cubic-bezier(.16, .72, .22, 1) backwards;
  }

  .game-table.is-fresh-turn .is-turn .turn-dot {
    animation: felt-turn 640ms ease-out;
  }

  .game-table.is-fresh-turn .is-turn .avatar {
    animation: felt-turn-avatar 440ms ease-out;
  }

  .capture-receipt {
    animation: felt-receipt 820ms 50ms ease-out both;
  }

  .capture-stack {
    animation: felt-capture 760ms cubic-bezier(.25, .65, .35, 1) both;
  }
}

@keyframes felt-deal {
  from { opacity: 0; transform: translate(var(--deal-x), var(--deal-y)) rotate(16deg) scale(.68); }
  22% { opacity: 1; }
  74% { transform: translate(-3px, 3px) rotate(-4deg) scale(1.04); }
  to { opacity: 1; }
}

@keyframes felt-deck {
  25% { color: var(--felt-cream); transform: rotate(12deg) scale(1.22); }
  63% { transform: rotate(-6deg) scale(1.04); }
}

@keyframes felt-welcome {
  from { opacity: 0; translate: 0 12px; }
  to { opacity: 1; translate: 0 0; }
}

@keyframes felt-play {
  from { opacity: .25; transform: translate(34px, -38px) rotate(-16deg) scale(1.12); }
  34% { opacity: 1; }
  70% { transform: translate(-2px, 3px) rotate(3deg) scale(.98); }
  to { opacity: 1; }
}

@keyframes felt-turn {
  0% { box-shadow: 0 0 0 1px #f8d38eaa; }
  52% { box-shadow: 0 0 0 10px #f8d38e00; }
  54% { box-shadow: 0 0 0 1px #f8d38e75; }
  100% { box-shadow: 0 0 0 7px #f8d38e00; }
}

@keyframes felt-turn-avatar {
  38% { transform: scale(1.12); box-shadow: 0 0 0 3px #f8d38e45; }
}

@keyframes felt-receipt {
  from { opacity: 0; transform: translate(-50%, -28%) scale(.86); }
  26% { opacity: 1; transform: translate(-50%, -55%) scale(1.04); }
  44%, 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  to { opacity: 0; transform: translate(-50%, -84%) scale(.98); }
}

@keyframes felt-capture {
  0% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(.78); }
  22% { opacity: 1; transform: translate(-50%, -50%) rotate(6deg) scale(1.06); }
  46% { opacity: .88; }
  100% { opacity: 0; transform: translate(-50%, calc(-50% + var(--capture-travel))) rotate(18deg) scale(.46); }
}

  <script>
(() => {
'use strict';
const __cuarentaModules = Object.create(null);
__cuarentaModules["js/engine.js"] = (() => {

/** Local, serializable rules engine. No DOM, network, or bot access to hidden cards. */
const RANKS = Object.freeze(['A', '2', '3', '4', '5', '6', '7', 'J', 'Q', 'K']);
const SUITS = Object.freeze(['hearts', 'diamonds', 'clubs', 'spades']);
const DEFAULT_BOT_NAME = 'Don Julio';
const STATUSES = ['playing', 'round-end', 'finished'];
const DIFFICULTIES = ['easy', 'medium', 'hard', 'expert'];
const copy = (value) => structuredClone(value);
const fail = (message) => { throw new Error(message); };
const numeric = (card) => RANKS.indexOf(card.rank) < 7 ? RANKS.indexOf(card.rank) + 1 : 0;
const hasRondaFall = (state) => state.rules.id === `cuarenta-local-v2-combo-${state.rules.comboPoints}`;

function createDeck() {
  return SUITS.flatMap((suit) => RANKS.map((rank) => ({ id: `${suit}-${rank}`, rank, suit })));
}

function randomInt(max, random) {
  if (random !== undefined) {
    if (typeof random !== 'function') fail('La fuente de azar debe ser una función.');
    const value = random();
    if (!Number.isFinite(value) || value < 0 || value >= 1) fail('El azar debe devolver un número entre 0 y 1, sin incluir 1.');
    return Math.floor(value * max);
  }
  if (!globalThis.crypto?.getRandomValues) fail('Este navegador no dispone de azar seguro.');
  // Rejection sampling avoids modulo bias. Fisher–Yates uses this bounded integer.
  const limit = Math.floor(0x100000000 / max) * max;
  const buffer = new Uint32Array(1);
  do { globalThis.crypto.getRandomValues(buffer); } while (buffer[0] >= limit);
  return buffer[0] % max;
}

function shuffle(cards, random) {
  const result = cards.slice();
  for (let i = result.length - 1; i > 0; i -= 1) {
    const j = randomInt(i + 1, random);
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function event(state, value) {
  const previous = state.history.at(-1)?.id ?? '';
  const sequence = Number(previous.split(':').at(-1)) + 1 || 1;
  state.history.push({ id: `${state.id}:${sequence}`, ...value });
  state.history = state.history.slice(-120);
  state.lastEvent = { ...value };
}

function ranksIn(hand) {
  const counts = new Map();
  for (const card of hand) counts.set(card.rank, (counts.get(card.rank) ?? 0) + 1);
  return counts;
}

function finish(state, playerId, kind, text) {
  state.status = 'finished';
  state.winner = playerId;
  event(state, { kind, text, playerId });
}

function dealHands(state, random) {
  if (state.deck.length < 10 || state.players.some((player) => player.hand.length)) {
    fail('No se puede repartir: las manos deben estar vacías y deben quedar diez cartas.');
  }
  const first = 1 - state.dealer;
  state.turn = first;
  state.lastPlay = null;
  if (hasRondaFall(state)) state.rondas = [null, null];
  let repetitions = 0;
  while (true) {
    state.players[first].hand = state.deck.splice(0, 5);
    state.players[1 - first].hand = state.deck.splice(0, 5);
    const quads = state.players.map((player) => [...ranksIn(player.hand).values()].includes(4));
    if (!quads.every(Boolean)) break;

function changeTableLayout(layout) {
  if (!Object.hasOwn(tableLayouts, layout)) return;
  horizontalRequested = layout === 'horizontal';

  const changed = prefs.tableLayout !== layout;
  prefs.tableLayout = layout;
  updateGameOrientation();
  for (const button of app.querySelectorAll('.table-layout-picker button')) {
    button.setAttribute('aria-pressed', String(button.dataset.layout === layout));
  }
  if (changed && !savePreferences(prefs)) toast('No se pudo guardar la orientación en este navegador.');
  if (horizontalRequested) void requestNativeRotation();
}

function updateGameOrientation() {
  const physicalLandscape = window.innerWidth > window.innerHeight;
  const rotated = horizontalRequested && mobileView.matches && !physicalLandscape;
  const root = document.documentElement;
  if (root.classList.contains('is-rotated-view') !== rotated) app.scrollTop = 0;
  root.classList.toggle('is-rotated-view', rotated);
  const gameShell = app.querySelector('.app-shell');
  if (!gameShell) return;
  const landscape = landscapeGame.matches || rotated;
  const compact = landscape && (rotated ? window.innerWidth : window.innerHeight) <= 500;
  gameShell.classList.toggle('is-compact-play', compact);
  if (screen !== 'game') return;
  gameShell.classList.toggle('is-landscape-play', landscape);
  gameShell.querySelector('#main').dataset.tableLayout = prefs.tableLayout;
}

async function requestNativeRotation() {
  const orientation = window.screen?.orientation;
  if (!mobileView.matches || !orientation?.lock || pendingNativeRotation || rotationOwnsLock) return;
  pendingNativeRotation = true;
  try {
    if (!document.fullscreenElement && document.fullscreenEnabled && document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
      rotationOwnsFullscreen = document.fullscreenElement === document.documentElement;
    }
    if (!horizontalRequested) return;
    await orientation.lock('landscape');
    rotationOwnsLock = true;
  } catch {
    // The rotated page remains available when the browser declines a native lock.
  } finally {
    pendingNativeRotation = false;
    if (!horizontalRequested) releaseNativeRotation();
    updateGameOrientation();
  }
}

function releaseNativeRotation() {
  if (rotationOwnsLock) {
    try { window.screen?.orientation?.unlock?.(); } catch { /* Restore the page even if the browser refuses. */ }
  }
  rotationOwnsLock = false;
  if (rotationOwnsFullscreen && document.fullscreenElement === document.documentElement) {
    document.exitFullscreen().catch(() => {});
  }
  rotationOwnsFullscreen = false;
}

function announce(text) { document.querySelector('#announcement').textContent = text; }
function toast(text) {
  const node = document.querySelector('#toast');
  clearTimeout(toastTimer); node.textContent = text; node.hidden = false;
  toastTimer = setTimeout(() => { node.hidden = true; }, 4500);
}

function getAudioContext() {
  if (!audioContext || audioContext.state === 'closed') {
    const Context = window.AudioContext || window.webkitAudioContext;
    if (!Context) return null;
    audioContext = new Context();
  }
  return audioContext;
}

function playSound(effect) {
  if (!prefs.sound || document.hidden) return;
  try {
    const context = getAudioContext();
    if (!context) return;
    if (context.state === 'running') {
      playCardSound(context, effect);
      return;
    }
    const requestedAt = performance.now();
    void context.resume().then(() => {
      // An interrupted browser may resume after the relevant play is over.
      if (prefs.sound && !document.hidden && context.state === 'running' && performance.now() - requestedAt < 350) {
        playCardSound(context, effect);
      }
    }).catch(() => {});
  } catch { /* Sound never interrupts the game. */ }
}

function playMoveSound(move, won) {
  let effect = 'place';
  if (won) effect = 'win';
  else if (move.fall) effect = 'fall';
  else if (move.captureIds.length) effect = 'capture';
  playSound(effect);
}

function musicIsActive() {
  return prefs.music && (tableMusic.isPlaying || Boolean(musicAttempt));
}

function updateMusicButton() {
  const button = app.querySelector('[data-action="music"]');
  if (!button) return;
  const active = musicIsActive();
  button.setAttribute('aria-pressed', String(active));
  button.title = `${active ? 'Pausar' : 'Activar'} música de fondo`;
}

function startMusic(reportError = false) {
  const trackId = prefs.musicTrack;
  if (!prefs.music || document.hidden || musicAttempt?.trackId === trackId) return;
  if (!musicActivated && navigator.userActivation?.hasBeenActive === false) return;
  musicActivated = true;
  const attempt = { trackId };
  musicAttempt = attempt;
  updateMusicButton();
  const status = modal.querySelector('#music-status');
  if (status) { status.hidden = true; status.textContent = ''; }
  void tableMusic.start({ trackId, volume: prefs.musicVolume }).then(played => {
    if (musicAttempt !== attempt) return;
    musicAttempt = null;
    updateMusicButton();
    if (played || !reportError) return;
    toggleMusic(false);
    const message = 'No se pudo iniciar la música. Puedes volver a activarla en Preferencias.';
    const currentStatus = modal.open && modal.querySelector('#music-status');
    if (currentStatus) { currentStatus.textContent = message; currentStatus.hidden = false; }
    else toast(message);
  });
}

function pauseMusic() {
  musicAttempt = null;
  tableMusic.pause();
  updateMusicButton();
}

function toggleMusic(enabled) {
  prefs.music = enabled;
  if (!savePreferences(prefs)) toast('No se pudo guardar la preferencia de música.');
  const checkbox = modal.querySelector('#music-enabled');
  if (checkbox) checkbox.checked = enabled;
  if (enabled) startMusic(true);
  else pauseMusic();
}

function cancelBot() { clearTimeout(botTimer); botTimer = null; }
function scheduleBot(delay = 0) {
  cancelBot();
  const v = session.view(0);
  if (screen !== 'game' || document.hidden || modal.open || !v || v.mode !== 'solo' || v.turn !== 1 || v.status !== 'playing') return;
  const revision = v.revision;
  botTimer = setTimeout(() => {
    if (session.revision !== revision || screen !== 'game' || document.hidden || modal.open) return;
    try {
      const botView = session.view(1);
      const command = chooseBotMove(botView, {
        feedbackChallenge: prefs.feedbackMode ? prefs.feedbackChallenge : 0,
      });
      const move = command && legalMoves(botView, 1).find(candidate =>
        candidate.cardId === command.cardId && candidate.captureIds.length === command.captureIds.length &&
        candidate.captureIds.every(id => command.captureIds.includes(id)));
      if (!move) throw new Error('No se pudo resolver el turno de la máquina.');
      session.dispatch({ type: 'PLAY', move: command }); afterMove(move, 1);
    } catch (error) { toast(error.message); render(); }
  }, Math.max(delay, prefs.quickBot || prefs.reducedMotion ? 280 : 1000));
}

function showPlayImpact(view, move) {
  const win = view.status === 'finished';
  const roundWin = win && ['ronda-victory', 'ronda-fall'].includes(view.lastEvent?.kind);
  if (!win && !move?.fall) return 0;
  const kind = roundWin ? 'ronda' : win ? 'win' : 'fall';
  const caption = roundWin
    ? (view.lastEvent.kind === 'ronda-fall' ? '¡Caída a la ronda!' : '¡Ronda ganadora!')
    : win ? '¡Partida ganada!' : move.clean ? '¡Caída y limpia!' : '¡Caída!';
  const cardId = view.lastEvent?.kind === 'ronda-victory'
    ? (locked ? undefined : view.rondas?.[view.winner]?.cardIds[0])
    : view.lastEvent?.kind === 'four-kind' ? undefined : move?.cardId;
  const card = impactCards.get(cardId);
  return renderImpact(app.querySelector('.game-table'), kind, caption, card);
}

const animateTable = () => !document.hidden && !prefs.reducedMotion && !systemReducedMotion.matches;

function renderImpact(target, kind, caption, card) {
  if (!target || !animateTable()) return 0;
  const impact = document.createElement('div');
  impact.className = `play-impact play-impact--${kind}`;
  impact.setAttribute('aria-hidden', 'true');
  impact.innerHTML = `
    <span class="impact-rays"></span><span class="impact-ring"></span>
    <span class="impact-particles">${Array.from({ length: 10 }, (_, i) => `<i style="--i:${i}"></i>`).join('')}</span>
    <span class="impact-hand">
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <path d="M36 95 25 74C18 68 12 61 8 52c-2-5 3-10 8-7l13 9L20 22c-2-6 5-10 9-5l12 24L35 12c-1-7 7-9 10-3l9 27-1-25c0-6 8-7 10-1l6 27 5-16c2-6 10-5 10 2l-3 34c0 12-4 23-12 30l-5 8Z" fill="currentColor"/>
      </svg>
    </span>
    <span class="impact-card">${cardMarkup(card, { back: !card })}</span>
    <span class="impact-caption">${caption}</span>`;
  target.append(impact);
  setTimeout(() => impact.remove(), 1080);
  return 1080;
}

function presentGameStatus(move) {
  const view = getView();
  if (!view || modal.open) return;
  if (!move && view.status === 'finished') playSound('win');
  const delay = showPlayImpact(view, move);
  if (view.status === 'playing') {
    const dealing = app.querySelector('.game-table.is-dealing') && animateTable();
    scheduleBot(Math.max(delay, dealing ? 660 : 0));
    return;
  }
  const showStatus = () => {
    const current = getView();
    if (screen !== 'game' || modal.open || current?.id !== view.id || current.revision !== view.revision) return;
    if (view.status === 'round-end') showRoundSummary();
    else if (view.status === 'finished') showResult();
  };
  if (delay) setTimeout(showStatus, delay);
  else showStatus();
}

function renderCapture(move, actor, center = app.querySelector('.table-center')) {
  if (!center || !move || move.fall || !move.captureIds.length) return 0;
  const receipt = document.createElement('span');
  receipt.className = 'capture-receipt';
  receipt.setAttribute('aria-hidden', 'true');
  receipt.innerHTML = `${icon('cards')} ${move.clean ? '¡Limpia! · ' : ''}+${move.captureIds.length + 1} cartas`;
  center.append(receipt);
  const animated = animateTable();
  if (animated) {
    // Only the card that was publicly played is shown in the moving pile.
    const stack = document.createElement('div');
    stack.className = `capture-stack${actor !== viewer ? ' is-rival' : ''}`;
    stack.setAttribute('aria-hidden', 'true');
    stack.innerHTML = cardMarkup(impactCards.get(move.cardId));
    center.append(stack);
    setTimeout(() => stack.remove(), 900);
  }
  setTimeout(() => receipt.remove(), animated ? 900 : 950);
  return animated ? 900 : 0;
}

function afterMove(move, actor) {
  selectedId = null; selectedMoveIndex = 0;
  const v = getView();
  if (v.mode === 'pass' && v.status === 'playing') locked = true;
  pendingPassMove = locked ? { id: v.id, revision: v.revision, move, actor } : null;
  const message = locked && v.lastEvent?.kind === 'ronda' ? 'Nuevo reparto.' : v.lastEvent?.text;
  announce(message || 'Jugada realizada.');
  playMoveSound(move, v.status === 'finished');
  pendingCardArrival = !locked && move.captureIds.length === 0;
  render(260);
  if (!locked && v.status === 'playing') renderCapture(move, actor);
  presentGameStatus(locked ? undefined : move);
}

function startGame(options) {
  cancelBot(); closeModal(false);
  try {
    session.dispatch({ type: 'NEW_GAME', options });
    pendingPassMove = null;
    screen = 'game'; mode = options.mode; difficulty = options.difficulty || 'medium'; viewer = 0; locked = mode === 'pass'; selectedId = null;
    render(); focusGame(); announce('Partida iniciada.');
    if (!musicIsActive()) startMusic();
    presentGameStatus();
    if (session.warning) toast(session.warning);
  } catch (error) { toast(error.message); }
}

function newGameOptions(gameMode = mode, gameDifficulty = difficulty, points = comboPoints) {
  const clean = (value, fallback) => value.replace(/[\u0000-\u001f]/g, '').trim().slice(0, 20) || fallback;
  const names = [clean(draftNames.player, 'Tú'), clean(draftNames[gameMode], gameMode === 'solo' ? DEFAULT_BOT_NAME : 'Jugador 2')];
  if (names[0] === names[1]) names[1] = names[1].slice(0, 17) + ' 2';
  return { mode: gameMode, names, comboPoints: points, difficulty: gameDifficulty };
}

function requestNewGame(options) {
  const prior = session.view(0);
  if (!prior || prior.status === 'finished') {
    startGame(options);
    return;
  }
  showModal('replace', `${modalHeader('¿Empezar otra partida?')}<p class="modal-intro">Si repartes ahora, la partida guardada de ${esc(prior.players[0].name)} y ${esc(prior.players[1].name)} se reemplazará.</p><button id="confirm-new" class="button primary full-width">Sí, repartir cartas ${icon('cards')}</button><button class="button text-button full-width" data-action="close-modal">Conservar la partida</button>`);

function showModal(kind, content) {

  if (!modal.open) lastFocus = document.activeElement;

  modal.dataset.kind = kind;
  modal.innerHTML = content;
  if (!modal.open) modal.showModal();
}

function closeModal(resume = true) {
  if (modal.open) modal.close();
  modalKind = null;
  delete modal.dataset.kind;
  if (lastFocus?.isConnected) lastFocus.focus();
  if (resume) scheduleBot();
}

das, desde 38 solo puntúa una caída, no una limpia. ${old ? '' : 'Una nueva ronda también suma sus 2 puntos y cierra la partida. La caída a una ronda gana con cualquier marcador.'} Cuatro iguales al repartir ganan automáticamente; si ambos los reciben, se repite ese reparto.</p></details><details><summary>Cuatro niveles, las mismas reglas</summary><p>Fácil elige jugadas legales al azar. Medio prioriza puntos y capturas. Difícil evalúa respuestas inmediatas y cuida sus cartas de ronda. Experto compara hasta 12 jugadas priorizadas y 8 respuestas probables del rival, y calcula una contra-jugada con las cartas que conserva. La retroalimentación local puede ampliar o reducir esta búsqueda. No recibe la mano rival ni el orden del mazo. Su búsqueda es heurística y no garantiza la victoria.</p></details><details><summary>Esta edición local</summary><p>Sin reloj ni penalizaciones por esperar. Juega contra la máquina o comparte el dispositivo, ocultando las manos entre turnos. El guardado pertenece a este navegador.</p></details></div><button class="button primary full-width" data-action="close-modal">Todo claro ${icon('check')}</button>`);

function resetTutorialAttempt() {
  tutorialCardId = null;
  tutorialCaptures.clear();
  tutorialFeedback = '';
  tutorialHint = false;
}

function openTutorial(track = tutorialTrack, restart = false) {
  const points = (screen === 'game' ? getView()?.rules.comboPoints : comboPoints) ?? 2;
  if (points !== tutorialComboPoints) {
    const all = createTutorialLessons(points);
    tutorialCourses = {
      starter: Object.keys(beginnerGuide).map(id => all.find(lesson => lesson.id === id)),
      extra: all.filter(lesson => !Object.hasOwn(beginnerGuide, lesson.id)),
    };
    tutorialComboPoints = points;
    tutorialSolved.clear();
    restart = true;
  }
  if (restart || track !== tutorialTrack) {
    const course = tutorialCourses[track];
    if (restart) course.forEach(lesson => tutorialSolved.delete(lesson.id));
    tutorialTrack = track;
    const firstUnsolved = course.findIndex(lesson => !tutorialSolved.has(lesson.id));
    tutorialStep = firstUnsolved === -1 ? course.length : firstUnsolved;
    resetTutorialAttempt();
  }
  showTutorial('#modal-title');
}
